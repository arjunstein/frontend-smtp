services:
  # Development service with Hot Module Replacement (HMR)
  frontend:
    build:
      context: .
      target: dev
    container_name: smtp_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8082
    restart: unless-stopped

  # Production service served with lightweight Nginx
  frontend-prod:
    build:
      context: .
      target: prod
    container_name: smtp_frontend_prod
    ports:
      - "3000:80"
    restart: unless-stopped
    profiles:
      - prod

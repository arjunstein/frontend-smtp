services:
  # Development service with Hot Module Replacement (HMR)
  frontend:
    build:
      context: .
      target: dev
    container_name: smtp_frontend_dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8082}
    restart: unless-stopped

  # Production service served with lightweight Nginx
  frontend-prod:
    build:
      context: .
      target: prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8082}
    container_name: smtp_frontend_prod
    ports:
      - "${FRONTEND_PROD_PORT:-3000}:80"
    restart: unless-stopped
    profiles:
      - prod

